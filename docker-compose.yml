version: "3.8"

services:
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./uploads:/usr/src/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - freightmatic-network

networks:
  freightmatic-network:
    driver: bridge